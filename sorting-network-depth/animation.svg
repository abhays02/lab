<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630"><rect width="1200" height="630" rx="24" fill="#111318"/><text x="56" y="64" fill="#8e96a8" font-family="system-ui" font-size="16">ABHAYS02 / LAB · SORTING NETWORKS</text><text x="56" y="132" fill="#fff" font-family="system-ui" font-size="52" font-weight="800">The textbook network is one round too deep.</text><text x="56" y="185" fill="#9fa6b5" font-family="system-ui" font-size="22">At 16 inputs: Batcher = 10. Proven optimum = 9.</text><g stroke="#343944" stroke-width="2"> <path d="M70 280H1110M70 310H1110M70 340H1110M70 370H1110M70 400H1110M70 430H1110"/></g><g stroke="#4a8be0" stroke-width="5"><path d="M120 280V310M120 340V370M120 400V430M210 310V340M210 370V400M300 280V310M300 340V370M390 310V340M390 400V430M480 280V310M480 340V370M570 370V400M660 280V310M660 400V430M750 340V370M840 310V340" stroke-dasharray="300" stroke-dashoffset="300"><animate attributeName="stroke-dashoffset" from="300" to="0" dur="3s" repeatCount="indefinite"/></path></g><text x="70" y="500" fill="#fff" font-family="system-ui" font-size="28">10 rounds</text><text x="320" y="500" fill="#9fa6b5" font-family="system-ui" font-size="28">vs</text><text x="420" y="500" fill="#eb5c28" font-family="system-ui" font-size="28" font-weight="700">9 optimal</text><text x="70" y="550" fill="#9fa6b5" font-family="system-ui" font-size="18">0/1 exhaustive verification passed for every input at n ≤ 16.</text></svg>