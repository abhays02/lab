name: Publish research explorer

on:
  pull_request:
    paths:
      - 'site/**'
      - 'scripts/build_site.py'
      - 'scripts/desktop.py'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'assets/**'
      - 'docs/**'
      - '**/README.md'
      - '**/animation.*'
      - '**/frame.png'
      - '**/evidence-still.png'
      - '**/*.json'
      - '**/*.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
      - run: python scripts/build_site.py
      - run: python scripts/desktop.py --smoke-test
      - uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: dist/site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5.0.0
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4.0.5
