<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 660" role="img" aria-labelledby="title description">
  <title id="title">Six experiments. One evidence trail.</title>
  <desc id="description">A map of the six research questions in the lab. Open the website for interactive workflows.</desc>
  <defs>
    <radialGradient id="glow"><stop stop-color="#183b43"/><stop offset="1" stop-color="#0c111b"/></radialGradient>
    <linearGradient id="accent"><stop stop-color="#72f4cf"/><stop offset="1" stop-color="#91aaff"/></linearGradient>
  </defs>
  <rect width="1400" height="660" rx="28" fill="url(#glow)"/>
  <g font-family="system-ui, sans-serif">
    <text x="60" y="62" fill="#72f4cf" font-size="17" letter-spacing="4">ABHAYS02 / LAB — RESEARCH ATLAS</text>
    <text x="60" y="130" fill="#f2f7ff" font-size="52" font-weight="700">Six experiments. One evidence trail.</text>
    <text x="60" y="174" fill="#b6c6d7" font-size="22">Start with a question. See the result. Inspect what actually ran.</text>
    <g fill="#111d2c" stroke="#3b5269">
      <rect x="60" y="220" width="410" height="140" rx="16"/>
      <rect x="495" y="220" width="410" height="140" rx="16"/>
      <rect x="930" y="220" width="410" height="140" rx="16"/>
      <rect x="60" y="385" width="410" height="140" rx="16"/>
      <rect x="495" y="385" width="410" height="140" rx="16"/>
      <rect x="930" y="385" width="410" height="140" rx="16"/>
    </g>
    <g fill="#b6c6d7" font-size="15" letter-spacing="2">
      <text x="84" y="253">01 / QUANTUM LEARNING</text>
      <text x="519" y="253">02 / MACHINE LEARNING</text>
      <text x="954" y="253">03 / MODEL SYSTEMS</text>
      <text x="84" y="418">04 / ALGORITHMS</text>
      <text x="519" y="418">05 / SIMULATION</text>
      <text x="954" y="418">06 / EVALUATION</text>
    </g>
    <g fill="#f2f7ff" font-size="27" font-weight="700">
      <text x="84" y="292">Barren plateaus</text>
      <text x="519" y="292">Double descent</text>
      <text x="954" y="292">Colibri / GLM</text>
      <text x="84" y="457">Sorting networks</text>
      <text x="519" y="457">Quantum boundary</text>
      <text x="954" y="457">Emergence mirage</text>
    </g>
    <g fill="#72f4cf" font-size="20">
      <text x="84" y="333">965× global variance drop</text>
      <text x="519" y="333">238,807 → 32.9 test MSE</text>
      <text x="954" y="333">5.38% active · arithmetic check</text>
      <text x="84" y="498">10 rounds vs 9 optimal</text>
      <text x="519" y="498">144.12 PB · storage arithmetic</text>
      <text x="954" y="498">Smooth curve, sharper metric</text>
    </g>
    <rect x="60" y="569" width="1280" height="2" fill="url(#accent)"/>
    <text x="60" y="612" fill="#b6c6d7" font-size="20">QUESTION → VISUAL → RESULT → CODE → RAW OUTPUT → PROVENANCE</text>
    <text x="1100" y="612" fill="#72f4cf" font-size="20">EXPLORE THE LAB ↗</text>
  </g>
</svg>
