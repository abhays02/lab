<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
  <title id="title">Question to reproducible evidence</title>
  <desc id="desc">A schematic sequence from a research question through its script and raw JSON to provenance notes.</desc>
  <rect width="960" height="280" rx="24" fill="#111318"/>
  <g font-family="system-ui,-apple-system,Segoe UI,sans-serif" text-anchor="middle">
    <g fill="#1d2330" stroke="#596170" stroke-width="2">
      <rect x="30" y="92" width="190" height="96" rx="14"/>
      <rect x="270" y="92" width="190" height="96" rx="14"/>
      <rect x="510" y="92" width="190" height="96" rx="14"/>
      <rect x="750" y="92" width="180" height="96" rx="14"/>
    </g>
    <g fill="#f5f7fa" font-size="19" font-weight="700">
      <text x="125" y="135">QUESTION</text>
      <text x="365" y="135">SCRIPT</text>
      <text x="605" y="135">RAW JSON</text>
      <text x="840" y="135">PROVENANCE</text>
    </g>
    <g fill="#9fa6b5" font-size="13">
      <text x="125" y="162">what is being checked?</text>
      <text x="365" y="162">what was run?</text>
      <text x="605" y="162">what came out?</text>
      <text x="840" y="162">what supports it?</text>
    </g>
    <g stroke="#9fa6b5" stroke-width="2" fill="none">
      <path d="M220 140h42m-10-8 10 8-10 8"/>
      <path d="M460 140h42m-10-8 10 8-10 8"/>
      <path d="M700 140h42m-10-8 10 8-10 8"/>
    </g>
    <text x="480" y="238" fill="#9fa6b5" font-size="13">Schematic workflow; not experimental data.</text>
  </g>
</svg>
