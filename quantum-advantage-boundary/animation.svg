<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630"><rect width="1200" height="630" rx="24" fill="#111318"/><text x="56" y="64" fill="#8e96a8" font-family="system-ui" font-size="16">ABHAYS02 / LAB · QUANTUM ADVANTAGE BOUNDARY</text><text x="56" y="132" fill="#fff" font-family="system-ui" font-size="50" font-weight="800">53 qubits → 144.12 PB</text><text x="56" y="182" fill="#9fa6b5" font-family="system-ui" font-size="22">That is the exact memory for one full complex128 statevector.</text><g transform="translate(70 250)"><rect x="0" y="145" width="110" height="35" fill="#4a8be0"/><rect x="150" y="100" width="110" height="80" fill="#4a8be0"/><rect x="300" y="50" width="110" height="130" fill="#4a8be0"/><rect x="450" y="0" width="110" height="180" fill="#eb5c28"><animate attributeName="height" values="0;180;180" dur="2.5s" repeatCount="indefinite"/></rect><text x="28" y="205" fill="#9fa6b5" font-family="system-ui" font-size="16">20q</text><text x="178" y="205" fill="#9fa6b5" font-family="system-ui" font-size="16">30q</text><text x="328" y="205" fill="#9fa6b5" font-family="system-ui" font-size="16">40q</text><text x="468" y="205" fill="#fff" font-family="system-ui" font-size="16">53q</text></g><text x="70" y="525" fill="#fff" font-family="system-ui" font-size="28">144.12 PB</text><text x="300" y="525" fill="#9fa6b5" font-family="system-ui" font-size="22">full statevector</text><text x="70" y="565" fill="#9fa6b5" font-family="system-ui" font-size="18">The real contest is what classical methods can do without storing it all.</text></svg>