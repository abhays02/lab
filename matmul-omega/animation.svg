<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630"><rect width="1200" height="630" rx="24" fill="#111318"/><text x="56" y="64" fill="#8e96a8" font-family="system-ui" font-size="16">ABHAYS02 / LAB · MATRIX MULTIPLICATION</text><text x="56" y="132" fill="#fff" font-family="system-ui" font-size="50" font-weight="800">Strassen changes the count, not magic.</text><text x="56" y="184" fill="#9fa6b5" font-family="system-ui" font-size="22">The call-count exponents match theory exactly.</text><text x="80" y="300" fill="#fff" font-family="system-ui" font-size="70" font-weight="800">n³</text><text x="255" y="300" fill="#9fa6b5" font-family="system-ui" font-size="24">naive</text><text x="520" y="300" fill="#4a8be0" font-family="system-ui" font-size="70" font-weight="800">n²·8074</text><text x="865" y="300" fill="#9fa6b5" font-family="system-ui" font-size="24">Strassen</text><path d="M80 430 C250 430 330 430 450 430" stroke="#4a8be0" stroke-width="8"/><path d="M560 430 C700 430 780 430 1080 430" stroke="#4a8be0" stroke-width="8" stroke-dasharray="20 14"><animate attributeName="stroke-dashoffset" from="0" to="-68" dur="1s" repeatCount="indefinite"/></path><text x="80" y="500" fill="#fff" font-family="system-ui" font-size="25">n = 2048</text><text x="280" y="500" fill="#9fa6b5" font-family="system-ui" font-size="22">262,144 naive leaf calls</text><text x="700" y="500" fill="#4a8be0" font-family="system-ui" font-size="22">117,649 Strassen</text><text x="80" y="555" fill="#eb5c28" font-family="system-ui" font-size="22">measured wall-clock speedup: only ≈ 1.06×</text></svg>